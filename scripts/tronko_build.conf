# Default settings for scripts/release_tronko.sh, for every marker.
#
# Override per marker in scripts/tronko_build.d/<marker>.conf, per run with
# --config FILE or --set KEY=VALUE. Later layers win: this file, the marker
# file, each --config, each --set and option. One KEY=VALUE per line; values
# are taken literally (never run as shell); *_ARGS values are split on spaces.
# Every effective value is recorded in the published params.json.
#
# The values below are the ones build_from_scratch() in
# edna-explorer-data-pipelines uses.

# Threads for FAMSA, VeryFastTree and tronko-build; empty = all CPUs.
THREADS=

# --- Clustering (ancestralclust) -------------------------------------------
# Inputs with more sequences than this are split with ancestralclust; smaller
# ones are built as one cluster.
CLUSTER_CUTOFF=25000
# bins = ceil(sequences / BIN_SIZE); seeds = min(bins * SEEDS_PER_BIN, MAX_SEEDS)
ANCESTRALCLUST_BIN_SIZE=20000
ANCESTRALCLUST_SEEDS_PER_BIN=30
ANCESTRALCLUST_MAX_SEEDS=4000
ANCESTRALCLUST_MIN_DESCENDANTS=75
ANCESTRALCLUST_MIN_CLUSTER=50
ANCESTRALCLUST_MAX_CLUSTER=25000
# -u: Needleman-Wunsch, better-balanced clusters; its code path is not
# thread-safe, hence -c 1.
ANCESTRALCLUST_ARGS=-f -u -c 1

# --- Per cluster: alignment, tree, root ------------------------------------
FAMSA_ARGS=
# auto: VeryFastTree if installed, else FastTree.
TREE_BUILDER=auto
VERYFASTTREE_ARGS=-gtr -gamma -nt -nosupport -fastexp 2
FASTTREE_ARGS=-nt -gtr -gamma
# Midpoint-root each tree with nw_reroot (true/false).
REROOT=true

# --- tronko-build -y ---------------------------------------------------------
# sum_of_pairs (-s -u SP_THRESHOLD) or min_leaf (-v -f MIN_LEAF)
PARTITION=sum_of_pairs
SP_THRESHOLD=0.1
MIN_LEAF=500
# -a: FastTree instead of RAxML inside tronko-build.
TRONKO_BUILD_ARGS=-a

# --- BWA ---------------------------------------------------------------------
BWA_INDEX_ARGS=
