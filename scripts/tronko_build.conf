# Default settings for scripts/release_tronko.sh, for every marker.
#
# Override per marker in scripts/tronko_build.d/<marker>.conf, per run with
# --config FILE or --set KEY=VALUE. Later layers win: this file, the marker
# file, each --config, each --set and option. One KEY=VALUE per line; values
# are taken literally (never run as shell); *_ARGS values are split on spaces.
# Every effective value is recorded in the published build_params.json.
#
# The build is build-tronko-db.sh, and the values below are the ones the
# Jetstream marker databases were built with (build-rcrux-marker-db.sh).

# Threads for FAMSA, the tree tool and tronko-build; empty = all CPUs.
THREADS=

# --- Clustering (ancestralclust) -------------------------------------------
# Inputs with more sequences than this are split with ancestralclust; smaller
# ones are built as one cluster.
CLUSTER_CUTOFF=25000
# bins = ceil(sequences / BIN_SIZE)
ANCESTRALCLUST_BIN_SIZE=10000
ANCESTRALCLUST_MIN_DESCENDANTS=75
# Extra ancestralclust arguments, e.g. -u -m 50 -x 25000
ANCESTRALCLUST_ARGS=

# --- Per cluster: alignment and tree -----------------------------------------
# Clusters aligned and built at once.
CLUSTER_JOBS=1
FAMSA_ARGS=
# veryfasttree, fasttree or raxml; also the tool tronko-build uses for partitions.
TREE_TOOL=veryfasttree
# Extra arguments for the per-cluster tree tool, e.g. -fastexp 2
TREE_ARGS=

# --- tronko-build -y ---------------------------------------------------------
# sum_of_pairs (-s -u SP_THRESHOLD) or min_leaf (-v -f MIN_LEAF)
PARTITION=sum_of_pairs
SP_THRESHOLD=0.1
MIN_LEAF=500
# legacy (main's SP score) or corrected
SP_FORMULA=legacy
# Input clusters partitioned at once (tronko-build -J).
TRONKO_BUILD_JOBS=1
TRONKO_BUILD_ARGS=

# --- BWA ---------------------------------------------------------------------
BWA_INDEX_ARGS=
