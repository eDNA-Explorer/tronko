name: Script Tests

on:
  push:
    branches: [ "*" ]
    paths: [ "scripts/**", "build-tronko-db.sh", "tronko-build/**", ".github/workflows/scripts.yml" ]
  pull_request:
    branches: [ main ]
    paths: [ "scripts/**", "build-tronko-db.sh", "tronko-build/**", ".github/workflows/scripts.yml" ]

jobs:
  scripts-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      run: curl -LsSf https://astral.sh/uv/0.9.5/install.sh | sh

    - name: Install what the real-build test compiles and runs with
      run: sudo apt-get update && sudo apt-get install -y bwa zlib1g-dev libzstd-dev

    - name: Run script tests
      working-directory: scripts
      run: |
        uv sync --frozen
        # The release tests drive the dvc CLI from the synced environment; the
        # real-build test uses the bundled x86-64 tools in bin/.
        PATH="$PWD/.venv/bin:$PATH:$PWD/../bin" uv run --frozen pytest -q -rs
