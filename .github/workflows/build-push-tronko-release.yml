name: Build and push tronko-release image

# The image ops/release/launch.sh runs on a Jetstream VM: Dockerfile.release at
# one tronko commit, tagged with that commit. Every push to main gets one; run
# it by hand for any other commit.
#
# Temporary: it goes to GitHub's registry until this repository may sign in to
# Google Cloud as js2-ci; then it moves to jetstream2-images, beside rcrux-build.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch or tag to build
        default: main

env:
  IMAGE: ghcr.io/edna-explorer/tronko-release

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          build-args: TRONKO_REF=${{ steps.commit.outputs.sha }}
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.commit.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
