name: Build and push tronko-release image

# The image ops/release/launch.sh runs on a Jetstream VM: Dockerfile.release at
# one tronko commit, tagged with that commit. Every push to main gets one; run
# it by hand for any other commit.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch or tag to build
        default: main

env:
  IMAGE: northamerica-northeast2-docker.pkg.dev/edna-explorer-shared/jetstream2-images/tronko-release

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Workload Identity Federation
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/103894471554/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: js2-ci@edna-explorer-shared.iam.gserviceaccount.com

      - run: gcloud auth configure-docker northamerica-northeast2-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@v3

      # Reads the internal edna-explorer-data-pipelines for the assignment check's toolkit.
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DATA_PIPELINES_DEPLOY_KEY }}

      # main's commit, not the name main, so the build cache refetches when main moves.
      - id: data-pipelines
        run: |
          echo "sha=$(git ls-remote git@github.com:eDNA-Explorer/edna-explorer-data-pipelines.git refs/heads/main | cut -f1)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          build-args: |
            TRONKO_REF=${{ steps.commit.outputs.sha }}
            DATA_PIPELINES_REF=${{ steps.data-pipelines.outputs.sha }}
          ssh: default=${{ env.SSH_AUTH_SOCK }}
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.commit.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
